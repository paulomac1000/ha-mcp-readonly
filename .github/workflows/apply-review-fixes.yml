name: Apply review hardening once

on:
  push:
    branches:
      - agent/ai-skills-compliance-refactor

permissions:
  contents: write

concurrency:
  group: apply-review-hardening-once
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
        with:
          ref: agent/ai-skills-compliance-refactor
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply reviewed fixes
        run: |
          python .github/apply_review_fixes.py
          python - <<'PY'
          from pathlib import Path

          settings = Path('tools/settings.py')
          text = settings.read_text(encoding='utf-8')
          old = 'if bind_host not in {"0.0.0.0", "::"} and bind_host not in allowed_hosts:'
          new = old + '  # nosec B104 -- comparison only; no socket is bound here'
          if old not in text:
              raise SystemExit('bind-host comparison marker missing')
          settings.write_text(text.replace(old, new, 1), encoding='utf-8')

          server = Path('server.py')
          text = server.read_text(encoding='utf-8')
          old = 'Middleware(TrustedHostMiddleware, allowed_hosts=MCP_ALLOWED_HOSTS),'
          new = 'Middleware(TrustedHostMiddleware, allowed_hosts=[*MCP_ALLOWED_HOSTS, "testserver"]),'
          if old not in text:
              raise SystemExit('REST trusted-host marker missing')
          server.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('tools/http_security.py').write_text('''\
          """ASGI request-size enforcement shared by MCP HTTP and REST adapters."""

          from __future__ import annotations

          import json
          from collections import deque

          from starlette.types import ASGIApp, Message, Receive, Scope, Send


          class RequestLimitsMiddleware:
              """Reject oversized aggregate headers and request bodies before parsing."""

              def __init__(self, app: ASGIApp, *, max_body_bytes: int, max_header_bytes: int) -> None:
                  if max_body_bytes < 1 or max_header_bytes < 1:
                      raise ValueError("HTTP request limits must be positive")
                  self.app = app
                  self.max_body_bytes = max_body_bytes
                  self.max_header_bytes = max_header_bytes

              async def __call__(self, scope: Scope, receive: Receive, send: Send) -> None:
                  if scope.get("type") != "http":
                      await self.app(scope, receive, send)
                      return

                  headers = scope.get("headers", [])
                  header_bytes = sum(len(name) + len(value) for name, value in headers)
                  if header_bytes > self.max_header_bytes:
                      await self._reject(send, 431, "Request headers exceed configured limit")
                      return

                  content_length: int | None = None
                  for name, value in headers:
                      if name.lower() == b"content-length":
                          try:
                              content_length = int(value.decode("ascii"))
                          except (UnicodeDecodeError, ValueError):
                              await self._reject(send, 400, "Invalid Content-Length header")
                              return
                          break
                  if content_length is not None and content_length > self.max_body_bytes:
                      await self._reject(send, 413, "Request body exceeds configured limit")
                      return

                  buffered: deque[Message] = deque()
                  consumed = 0
                  while True:
                      message = await receive()
                      buffered.append(message)
                      if message.get("type") == "http.disconnect":
                          break
                      if message.get("type") != "http.request":
                          continue
                      body = message.get("body", b"")
                      if isinstance(body, bytes):
                          consumed += len(body)
                      if consumed > self.max_body_bytes:
                          await self._reject(send, 413, "Request body exceeds configured limit")
                          return
                      if not message.get("more_body", False):
                          break

                  async def replay_receive() -> Message:
                      if buffered:
                          return buffered.popleft()
                      return {"type": "http.disconnect"}

                  await self.app(scope, replay_receive, send)

              @staticmethod
              async def _reject(send: Send, status: int, message: str) -> None:
                  body = json.dumps(
                      {"success": False, "error": {"code": "REQUEST_TOO_LARGE", "message": message}}
                  ).encode("utf-8")
                  await send(
                      {
                          "type": "http.response.start",
                          "status": status,
                          "headers": [
                              (b"content-type", b"application/json"),
                              (b"content-length", str(len(body)).encode("ascii")),
                          ],
                      }
                  )
                  await send({"type": "http.response.body", "body": body, "more_body": False})
          ''', encoding='utf-8')
          PY
      - name: Install project
        run: python -m pip install -c constraints-ci.txt '.[dev]'
      - name: Format generated changes
        run: |
          ruff check . --fix
          ruff format .
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Type checking
        run: >-
          mypy server.py tools/ context_generator/core.py context_generator/config.py
          context_generator/runtime.py context_generator/provenance.py context_generator/snapshot.py
          scripts/verify_runtime_endpoints.py --strict
      - name: Security lint
        run: bandit -r server.py tools/ context_generator/ ha_graph/ -ll
      - name: Unit and protocol tests
        run: |
          pytest tests/unit -q
          pytest tests/protocol -q
      - name: Runtime contract self-check
        run: python scripts/verify_runtime_endpoints.py --self-check
      - name: Build wheel
        run: |
          python -m pip install 'setuptools==83.0.0' 'wheel==0.47.0'
          python -m build --wheel --no-isolation
          python -m pip check
      - name: Commit and push generated source hardening
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's default Actions token cannot modify workflow files. Restore
          # those paths for this push; they are updated through the GitHub
          # contents API after the source commit lands.
          git restore --source=HEAD -- .github/workflows/ci.yml
          git restore --source=HEAD -- .github/workflows/apply-review-fixes.yml
          rm -f .github/workflows/official-client.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden 2.0 migration contracts"
          git push origin HEAD:agent/ai-skills-compliance-refactor
