name: Migration evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: migration-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MCP_TRANSPORT: stdio
  MCP_DEV_TOOLS_ENABLED: "0"
  HA_CONFIG_PATH: /tmp

jobs:
  evidence:
    name: Migration evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASSESSED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project in isolated runner environment
        run: python -m pip install -c constraints-ci.txt '.[dev]'
      - name: Verify source contracts
        run: |
          ruff check .
          ruff format --check .
          mypy server.py tools/ context_generator/core.py context_generator/config.py \
            context_generator/runtime.py context_generator/provenance.py context_generator/snapshot.py \
            scripts/verify_runtime_endpoints.py --strict
          bandit -r server.py tools/ context_generator/ ha_graph/ -ll
          pytest tests/unit -q
          pytest tests/protocol -q
      - name: Build and exercise exact wheel over stdio
        run: |
          python -m build --wheel --no-isolation
          python -m venv /tmp/migration-wheel
          /tmp/migration-wheel/bin/python -m pip install dist/*.whl
          /tmp/migration-wheel/bin/python -m pip check
          /tmp/migration-wheel/bin/python - <<'PY'
          import asyncio
          import os
          from fastmcp import Client
          from fastmcp.client.transports import StdioTransport

          async def verify():
              transport = StdioTransport(
                  command='/tmp/migration-wheel/bin/ha-mcp-readonly',
                  args=[],
                  env={**os.environ, 'MCP_TRANSPORT': 'stdio', 'HEALTH_SERVER_ENABLED': '0'},
              )
              async with Client(transport, timeout=30) as client:
                  tools = await client.list_tools()
                  assert len(tools) == 145
                  result = await client.call_tool('describe_ha_capabilities', {})
                  assert not result.is_error

          asyncio.run(verify())
          PY
      - name: Correlate exact-head CI and artifact evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['ASSESSED_SHA']
          token = os.environ['GH_TOKEN']
          current_run = int(os.environ['GITHUB_RUN_ID'])
          api = 'https://api.github.com'

          def get(path):
              request = urllib.request.Request(
                  api + path,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          deadline = time.monotonic() + 30 * 60
          ci = None
          while time.monotonic() < deadline:
              query = urllib.parse.urlencode({'head_sha': head, 'event': 'pull_request', 'per_page': 50})
              runs = get(f'/repos/{repo}/actions/runs?{query}').get('workflow_runs', [])
              matches = [run for run in runs if run.get('name') == 'CI' and int(run.get('id', 0)) != current_run]
              if matches:
                  candidate = max(matches, key=lambda run: int(run['id']))
                  if candidate.get('status') == 'completed':
                      if candidate.get('conclusion') != 'success':
                          raise SystemExit(f"correlated CI failed: {candidate.get('html_url')}")
                      ci = candidate
                      break
              time.sleep(10)
          if ci is None:
              raise SystemExit('timed out waiting for successful exact-head CI')
          if ci.get('head_sha') != head:
              raise SystemExit(f"CI head mismatch: expected {head}, got {ci.get('head_sha')}")

          jobs = get(f"/repos/{repo}/actions/runs/{ci['id']}/jobs?per_page=100").get('jobs', [])
          expected = {
              'Quality and standards',
              'Tests (Python 3.11)',
              'Tests (Python 3.12)',
              'Tests (Python 3.13)',
              'Tests (Python 3.14)',
              'Build and inspect wheel',
              'Container (amd64) from tested wheel',
              'Container (arm64) from tested wheel',
          }
          by_name = {job['name']: job for job in jobs}
          missing = sorted(expected - by_name.keys())
          if missing:
              raise SystemExit(f'missing required CI jobs: {missing}')
          failed = {name: by_name[name].get('conclusion') for name in expected if by_name[name].get('conclusion') != 'success'}
          if failed:
              raise SystemExit(f'non-success required CI jobs: {failed}')

          artifacts = get(f"/repos/{repo}/actions/runs/{ci['id']}/artifacts?per_page=100").get('artifacts', [])
          required_artifact_prefixes = ('python-wheel-', 'container-image-')
          selected = [
              artifact for artifact in artifacts
              if artifact.get('name', '').startswith(required_artifact_prefixes)
          ]
          if len(selected) < 3:
              raise SystemExit(f'expected wheel plus two container artifacts, got {[a.get("name") for a in selected]}')
          for artifact in selected:
              digest = artifact.get('digest')
              if not isinstance(digest, str) or not digest.startswith('sha256:'):
                  raise SystemExit(f'artifact lacks provider digest: {artifact.get("name")}')

          wheel = next(Path('dist').glob('*.whl'))
          wheel_digest = 'sha256:' + hashlib.sha256(wheel.read_bytes()).hexdigest()
          report = {
              'schema_version': 1,
              'repository': repo,
              'assessed_revision': head,
              'evidence_workflow_run_id': current_run,
              'correlated_ci': {
                  'run_id': int(ci['id']),
                  'workflow_id': int(ci['workflow_id']),
                  'head_sha': ci['head_sha'],
                  'event': ci['event'],
                  'conclusion': ci['conclusion'],
                  'jobs': {
                      name: {
                          'job_id': int(by_name[name]['id']),
                          'check_run_id': int(by_name[name]['id']),
                          'conclusion': by_name[name]['conclusion'],
                      }
                      for name in sorted(expected)
                  },
                  'artifacts': [
                      {
                          'artifact_id': int(artifact['id']),
                          'name': artifact['name'],
                          'provider_digest': artifact['digest'],
                      }
                      for artifact in sorted(selected, key=lambda value: value['name'])
                  ],
              },
              'local_evidence_lane': {
                  'python': '3.13',
                  'quality': 'passed',
                  'unit_protocol': 'passed',
                  'clean_wheel_install': 'passed',
                  'real_stdio': 'passed',
                  'wheel_content_digest': wheel_digest,
              },
              'limitations': [
                  'No real HA_URL/HA_TOKEN was available to this public CI lane.',
                  'This structural evidence is not an independent L3 approval.',
              ],
          }
          path = Path('evidence/migration-evidence.json')
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('evidence/migration-evidence.json.sha256').write_text(
              f'{digest}  migration-evidence.json\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          print('report_sha256=' + digest)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: migration-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
