name: Patch action version comments

on:
  push:
    branches: ["agent/consolidate-dependabot-updates"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/consolidate-dependabot-updates
      - name: Correct pinned action version comments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6":
                  "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7",
              "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6":
                  "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7",
              "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6":
                  "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7",
              "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6":
                  "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7",
          }
          for path in Path(".github/workflows").glob("*.yml"):
              if path.name == "patch-action-version-comments.yml":
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "docs(ci): correct action version comments"
          git push origin HEAD:agent/consolidate-dependabot-updates
