name: Patch dependency changelog

on:
  push:
    branches: ["agent/consolidate-dependabot-updates"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/consolidate-dependabot-updates
      - name: Correct dependency maintenance entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          old = "- Added Dependabot guards for MCP 2.x while FastMCP 3.4.x requires `mcp<2`, and for standalone `pydantic-core` updates because Pydantic pins its core dependency exactly."
          new = "- Added a Dependabot guard for MCP 2.x while FastMCP 3.4.x requires `mcp<2`; removed the redundant `pydantic-core` constraint so Pydantic's exact dependency remains authoritative and security updates stay actionable."
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: clarify dependency maintenance"
          git push origin HEAD:agent/consolidate-dependabot-updates
