name: PR22 AFDS owner correction

on:
  push:
    branches:
      - agent/ai-skills-compliance-refactor

permissions:
  contents: write

jobs:
  correct-and-validate:
    if: github.event.head_commit.message == 'chore: run AFDS owner correction'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
        with:
          ref: agent/ai-skills-compliance-refactor
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
      - name: Restore current AFDS owners field
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              'AGENTS.md',
              'CHANGELOG.md',
              'CONTRIBUTING.md',
              'SECURITY.md',
              'docs/documentation.md',
              'docs/testing-guidelines.md',
          ]
          for raw in paths:
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              if '\nowners:' in text:
                  continue
              if '\nowner:' not in text:
                  raise SystemExit(f'{raw}: missing owner/owners frontmatter field')
              path.write_text(text.replace('\nowner:', '\nowners:', 1), encoding='utf-8')
          PY
          git diff --check
      - name: Validate against exact pinned ai-skills validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
        with:
          repository: paulomac1000/ai-skills
          ref: b54fc6b27ea80b36a70d5de73445970e17f55789
          path: .ai-skills
          persist-credentials: false
      - name: Run AFDS validator
        run: >-
          python .ai-skills/skills/afds-doc-writer/validate.py
          AGENTS.md CONTRIBUTING.md SECURITY.md docs/documentation.md
          docs/testing-guidelines.md docs/ai-skills-adoption.md
      - name: Push validated documentation correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md CHANGELOG.md CONTRIBUTING.md SECURITY.md docs/documentation.md docs/testing-guidelines.md
          git commit -m 'fix: align AFDS ownership metadata with pinned validator'
          git push origin HEAD:agent/ai-skills-compliance-refactor
