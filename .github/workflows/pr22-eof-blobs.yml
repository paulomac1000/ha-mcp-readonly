name: PR22 EOF Blobs

on:
  push:
    branches: [agent/ai-skills-compliance-refactor]
    paths:
      - scripts/pr22_eof_trigger.py

permissions:
  contents: write

jobs:
  blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/ai-skills-compliance-refactor
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Apply only EOF autofix
        run: |
          python -m pip install 'pre-commit==4.3.0'
          set +e
          pre-commit run end-of-file-fixer --all-files
          first_status=$?
          set -e
          if [ "$first_status" -ne 0 ]; then
            pre-commit run end-of-file-fixer --all-files
          fi
          git diff --check
      - name: Create fixed workflow blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          changed = []
          for path in ('.github/workflows/ci.yml', '.github/workflows/publish.yml'):
              raw = Path(path).read_bytes()
              assert raw.endswith(b'\n'), path
              payload = json.dumps({
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              }).encode()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              print(f'VALIDATED_BLOB {path} {result["sha"]}')
          PY
