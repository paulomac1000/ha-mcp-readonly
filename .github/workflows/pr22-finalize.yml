name: PR22 finalizer

on:
  push:
    branches:
      - agent/ai-skills-compliance-refactor

permissions:
  contents: write

concurrency:
  group: pr22-finalizer
  cancel-in-progress: false

jobs:
  test-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
        with:
          ref: agent/ai-skills-compliance-refactor
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pr22_finalize.py
          python scripts/pr22_lastmile.py
          python scripts/pr22_catalog_fix.py
      - name: Verify in isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -c constraints-ci.txt '.[dev]'
          .venv/bin/ruff format \
            server.py tools/operations.py tools/capabilities.py tools/invocation.py tools/settings.py \
            tools/utils.py tools/filesystem_explorer.py context_generator/snapshot.py \
            context_generator/utils.py tests/unit/conftest.py tests/unit/manifest_helpers.py \
            tests/unit/test_manifests.py tests/unit/test_invocation_kernel.py \
            tests/unit/test_compliance_hardening.py tests/unit/test_review_regressions.py \
            tests/unit/test_context_generator.py tests/protocol/test_home_assistant_upstream_contract.py \
            tests/protocol/test_mcp_protocol.py tests/e2e/conftest.py tests/e2e/test_server_api.py \
            tests/e2e/test_all_tools_smoke.py tests/integration/conftest.py tests/smoke/conftest.py \
            tests/smoke/test_critical_tools.py tests/smoke/test_input_validation.py \
            tests/smoke/test_response_format.py scripts/pr22_finalize.py scripts/pr22_review_fix.py \
            scripts/pr22_lastmile.py scripts/pr22_catalog_fix.py
          .venv/bin/ruff check --fix \
            scripts/pr22_finalize.py scripts/pr22_lastmile.py scripts/pr22_catalog_fix.py \
            tests/unit/test_manifests.py tests/unit/test_invocation_kernel.py \
            tests/unit/test_context_generator.py tests/protocol/test_home_assistant_upstream_contract.py \
            tests/protocol/test_mcp_protocol.py
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy server.py tools/ context_generator/core.py context_generator/config.py \
            context_generator/runtime.py context_generator/provenance.py context_generator/snapshot.py \
            scripts/verify_runtime_endpoints.py --strict
          .venv/bin/pytest tests/unit tests/protocol -q
          .venv/bin/python -m compileall -q server.py tools context_generator
      - name: Commit and push tested fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/pr22-review-fix-runner.yml \
            .github/workflows/pr22-finalize.yml \
            scripts/pr22_review_fix.py \
            scripts/pr22_finalize.py \
            scripts/pr22_lastmile.py \
            scripts/pr22_catalog_fix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address PR22 review and CI blockers"
          git push origin HEAD:agent/ai-skills-compliance-refactor
