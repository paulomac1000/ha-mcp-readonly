name: PR22 Review Fix Validator

on:
  push:
    branches: [agent/ai-skills-compliance-refactor]
    paths:
      - scripts/pr22_migration_redirect_trigger.py

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MCP_TRANSPORT: stdio
  MCP_DEV_TOOLS_ENABLED: "0"
  HA_CONFIG_PATH: /tmp

jobs:
  fix-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/ai-skills-compliance-refactor
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - name: Apply source review fixes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/paulomac1000/ai-skills/b54fc6b27ea80b36a70d5de73445970e17f55789/skills/afds-doc-writer/validate.py \
            -o scripts/vendor/afds_validate_b54fc6b2.py
          python - <<'PY'
          from pathlib import Path

          cassette = Path('tests/protocol/test_home_assistant_upstream_contract.py')
          text = cassette.read_text(encoding='utf-8')
          old = 'Path(__file__).with_name("cassettes").joinpath("recorded_ha_upstream.json").read_text()'
          new = 'Path(__file__).with_name("cassettes").joinpath("recorded_ha_upstream.json").read_text(encoding="utf-8")'
          if old not in text:
              raise SystemExit('cassette read_text pattern not found')
          cassette.write_text(text.replace(old, new, 1), encoding='utf-8')

          fs = Path('tools/filesystem_explorer.py')
          text = fs.read_text(encoding='utf-8')
          old = '''            if re.search(re.escape(pattern), content, re.IGNORECASE):
                matches: list[dict[str, Any]] = []
                for match in re.finditer(re.escape(pattern), content, re.IGNORECASE):
                    match_start = max(0, match.start() - 30)
                    match_end = min(len(content), match.end() + 30)
                    match_context = content[match_start:match_end].replace("\\n", " ").strip()
                    matches.append({"position": match.start(), "context": match_context})
                    if len(matches) >= 3:
                        break
                results.append(
                    {
                        "path": relative_path.as_posix(),
                        "absolute_path": str(filepath),
                        "matches_count": len(
                            list(re.finditer(re.escape(pattern), content, re.IGNORECASE))
                        ),
                        "sample_matches": matches[:3],
                    }
                )
'''
          new = '''            matches: list[dict[str, Any]] = []
            matches_count = 0
            for match in re.finditer(re.escape(pattern), content, re.IGNORECASE):
                matches_count += 1
                if len(matches) >= 3:
                    continue
                match_start = max(0, match.start() - 30)
                match_end = min(len(content), match.end() + 30)
                match_context = content[match_start:match_end].replace("\\n", " ").strip()
                matches.append({"position": match.start(), "context": match_context})
            if matches_count:
                results.append(
                    {
                        "path": relative_path.as_posix(),
                        "absolute_path": str(filepath),
                        "matches_count": matches_count,
                        "sample_matches": matches,
                    }
                )
'''
          if old not in text:
              raise SystemExit('filesystem match-count block not found')
          fs.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify exact pinned validator
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/paulomac1000/ai-skills/b54fc6b27ea80b36a70d5de73445970e17f55789/skills/afds-doc-writer/validate.py \
            -o /tmp/afds-validate-upstream.py
          cmp -s scripts/vendor/afds_validate_b54fc6b2.py /tmp/afds-validate-upstream.py
          sha256sum scripts/vendor/afds_validate_b54fc6b2.py /tmp/afds-validate-upstream.py
      - name: Fresh venv and full source gate
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-review
          . .venv-review/bin/activate
          python -m pip install -c constraints-ci.txt '.[dev]'
          ruff check .
          ruff format --check .
          mypy server.py tools/ context_generator/core.py context_generator/config.py \
            context_generator/runtime.py context_generator/provenance.py context_generator/snapshot.py \
            scripts/verify_runtime_endpoints.py --strict
          pytest tests/unit tests/protocol -q
          make docs-check
          python -m compileall -q server.py tools context_generator ha_graph scripts
      - name: Commit verified source fixes
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/vendor/afds_validate_b54fc6b2.py \
            tests/protocol/test_home_assistant_upstream_contract.py \
            tools/filesystem_explorer.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: address latest review findings'
          git push origin HEAD:agent/ai-skills-compliance-refactor
