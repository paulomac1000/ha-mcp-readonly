name: PR22 review fixer

on:
  push:
    branches:
      - agent/ai-skills-compliance-refactor
    paths:
      - scripts/pr22_migration_redirect_trigger.py

jobs:
  patch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/ai-skills-compliance-refactor
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Apply exact validator and review fixes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/paulomac1000/ai-skills/b54fc6b27ea80b36a70d5de73445970e17f55789/skills/afds-doc-writer/validate.py' \
            -o scripts/vendor/afds_validate_b54fc6b2.py
          python scripts/pr22_migration_redirect_trigger.py --apply
      - name: Verify in fresh venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-review
          . .venv-review/bin/activate
          python -m pip install -c constraints-ci.txt '.[dev]'
          ruff check .
          ruff format --check .
          mypy server.py tools/ context_generator/core.py context_generator/config.py context_generator/runtime.py context_generator/provenance.py context_generator/snapshot.py scripts/verify_runtime_endpoints.py --strict
          pytest tests/unit tests/protocol -q
          make docs-check
          python -m compileall -q server.py tools context_generator ha_graph scripts
      - name: Commit source fixes
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add scripts/vendor/afds_validate_b54fc6b2.py tests/protocol/test_home_assistant_upstream_contract.py tools/filesystem_explorer.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: address latest review findings'
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/ai-skills-compliance-refactor
