name: PR22 review fix runner

on:
  push:
    branches:
      - agent/ai-skills-compliance-refactor

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
        with:
          ref: agent/ai-skills-compliance-refactor
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/pr22_review_fix.py')
          text = path.read_text(encoding='utf-8')
          old = '''    updated, count = re.subn(r"(?m)^owners:", "owner:", text, count=1)\n    if count != 1:\n        raise SystemExit(f"{doc}: expected one owners frontmatter key, found {count}")\n    write(doc, updated)\n'''
          new = '''    updated, count = re.subn(r"(?m)^owners:", "owner:", text, count=1)\n    if count == 0 and re.search(r"(?m)^owner:", text):\n        continue\n    if count != 1:\n        raise SystemExit(f"{doc}: expected one owner/owners frontmatter key, found {count}")\n    write(doc, updated)\n'''
          if text.count(old) != 1:
              raise SystemExit('owner patch target missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/pr22_review_fix.py
      - name: Verify in isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -c constraints-ci.txt '.[dev]'
          .venv/bin/ruff format \
            server.py tools/invocation.py tools/settings.py tools/utils.py tools/filesystem_explorer.py \
            context_generator/snapshot.py context_generator/utils.py \
            tests/unit/test_manifests.py tests/unit/test_review_regressions.py \
            tests/e2e/conftest.py tests/e2e/test_server_api.py tests/e2e/test_all_tools_smoke.py \
            tests/integration/conftest.py tests/smoke/conftest.py tests/smoke/test_critical_tools.py \
            tests/smoke/test_input_validation.py tests/smoke/test_response_format.py
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy server.py tools/ context_generator/core.py context_generator/config.py \
            context_generator/runtime.py context_generator/provenance.py context_generator/snapshot.py \
            scripts/verify_runtime_endpoints.py --strict
          .venv/bin/pytest tests/unit tests/protocol -q
          .venv/bin/python -m compileall -q server.py tools context_generator
      - name: Commit and push tested fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr22-review-fix-runner.yml scripts/pr22_review_fix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address PR22 review and CI blockers"
          git push origin HEAD:agent/ai-skills-compliance-refactor
