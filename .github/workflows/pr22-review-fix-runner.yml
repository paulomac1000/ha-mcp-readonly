name: PR22 review fix runner

on:
  push:
    branches:
      - agent/ai-skills-compliance-refactor

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
        with:
          ref: agent/ai-skills-compliance-refactor
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/pr22_review_fix.py')
          text = path.read_text(encoding='utf-8')

          old_helper = '''def replace_once(path: str, old: str, new: str) -> None:\n    text = read(path)\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(\n            f"{path}: expected one replacement target, found {count}: {old[:100]!r}"\n        )\n    write(path, text.replace(old, new, 1))\n'''
          new_helper = '''def replace_once(path: str, old: str, new: str) -> None:\n    text = read(path)\n    count = text.count(old)\n    if count == 0 and new in text:\n        return\n    if count != 1:\n        raise SystemExit(\n            f"{path}: expected one replacement target, found {count}: {old[:100]!r}"\n        )\n    write(path, text.replace(old, new, 1))\n'''
          if text.count(old_helper) != 1:
              raise SystemExit('replace_once helper patch target missing')
          text = text.replace(old_helper, new_helper, 1)

          old_owner = '''    updated, count = re.subn(r"(?m)^owners:", "owner:", text, count=1)\n    if count != 1:\n        raise SystemExit(f"{doc}: expected one owners frontmatter key, found {count}")\n    write(doc, updated)\n'''
          new_owner = '''    updated, count = re.subn(r"(?m)^owners:", "owner:", text, count=1)\n    if count == 0:\n        if text.startswith("---\\n") and not re.search(r"(?m)^owner:", text):\n            raise SystemExit(f"{doc}: frontmatter has neither owner nor owners")\n        continue\n    write(doc, updated)\n'''
          if text.count(old_owner) != 1:
              raise SystemExit('owner patch target missing')
          text = text.replace(old_owner, new_owner, 1)

          old_probe_decl = '''old_probe = \'\'\'          for _ in $(seq 1 100); do\n            if python - <<'PY'\n          import socket\n          try:\n              with socket.create_connection(('127.0.0.1', 9092), timeout=0.2):\n                  pass\n          except OSError:\n              raise SystemExit(1)\n          PY\n            then\n              break\n            fi\n            sleep 0.2\n          done\n          docker inspect --format '{{.State.Status}}' ha-mcp-official | grep -qx running\n\'\'\'\n'''
          new_probe_decl = '''old_probe = \'\'\'          for _ in $(seq 1 100); do\n            if python - <<'PY'\n          import socket\n          try:\n              with socket.create_connection(('127.0.0.1', 9092), timeout=.2):\n                  pass\n          except OSError:\n              raise SystemExit(1)\n          PY\n            then break; fi\n            sleep .2\n          done\n          docker inspect --format '{{.State.Status}} {{.State.Running}} {{.State.ExitCode}}' ha-mcp-official\n\'\'\'\n'''
          if text.count(old_probe_decl) != 1:
              raise SystemExit('official-client probe declaration patch target missing')
          text = text.replace(old_probe_decl, new_probe_decl, 1)

          old_newline = r'context = content[match_start:match_end].replace("\n", " ").strip()'
          new_newline = r'context = content[match_start:match_end].replace("\\n", " ").strip()'
          if text.count(old_newline) != 1:
              raise SystemExit('filesystem generated newline patch target missing')
          path.write_text(text.replace(old_newline, new_newline, 1), encoding='utf-8')
          PY
          python scripts/pr22_review_fix.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one post-patch target')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # os.walk rewrite uses pathlib.Path.
          replace_once(
              'context_generator/snapshot.py',
              'from datetime import UTC, datetime, timedelta\n',
              'from datetime import UTC, datetime, timedelta\nfrom pathlib import Path\n',
          )

          # The branch already has the correct shared autouse fixture in tests/unit/conftest.py.
          # Strengthen it to deep-copy nested manifests and restore dicts in place so imported
          # references are not invalidated.
          p = Path('tests/unit/conftest.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import asyncio\n', 'import asyncio\nimport copy\n', 1)
          old = '''    snapshot = {\n        "_TOOL_MANIFESTS": dict(manifests_module._TOOL_MANIFESTS),\n        "_ACTIVE_TOOL_NAMES": manifests_module._ACTIVE_TOOL_NAMES,\n        "_INACTIVE_REASONS": dict(manifests_module._INACTIVE_REASONS),\n    }\n    yield\n    manifests_module._TOOL_MANIFESTS = snapshot["_TOOL_MANIFESTS"]\n    manifests_module._ACTIVE_TOOL_NAMES = snapshot["_ACTIVE_TOOL_NAMES"]\n    manifests_module._INACTIVE_REASONS = snapshot["_INACTIVE_REASONS"]\n'''
          new = '''    manifests = copy.deepcopy(manifests_module._TOOL_MANIFESTS)\n    active = manifests_module._ACTIVE_TOOL_NAMES\n    reasons = dict(manifests_module._INACTIVE_REASONS)\n    try:\n        yield\n    finally:\n        manifests_module._TOOL_MANIFESTS.clear()\n        manifests_module._TOOL_MANIFESTS.update(manifests)\n        manifests_module._ACTIVE_TOOL_NAMES = active\n        manifests_module._INACTIVE_REASONS.clear()\n        manifests_module._INACTIVE_REASONS.update(reasons)\n'''
          if text.count(old) != 1:
              raise SystemExit('tests/unit/conftest.py: manifest fixture target missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Remove the redundant per-module fixture introduced by the first patch; isolation is
          # intentionally centralized in tests/unit/conftest.py for every unit module.
          p = Path('tests/unit/test_manifests.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import copy\n', '', 1)
          text = text.replace('import tools.manifests as manifests_module\n', '', 1)
          fixture = '''@pytest.fixture(autouse=True)\ndef _restore_manifest_state():\n    manifests = copy.deepcopy(manifests_module._TOOL_MANIFESTS)\n    active = manifests_module._ACTIVE_TOOL_NAMES\n    reasons = dict(manifests_module._INACTIVE_REASONS)\n    try:\n        yield\n    finally:\n        manifests_module._TOOL_MANIFESTS.clear()\n        manifests_module._TOOL_MANIFESTS.update(manifests)\n        manifests_module._ACTIVE_TOOL_NAMES = active\n        manifests_module._INACTIVE_REASONS.clear()\n        manifests_module._INACTIVE_REASONS.update(reasons)\n\n\n'''
          if text.count(fixture) != 1:
              raise SystemExit('tests/unit/test_manifests.py: redundant fixture target missing')
          p.write_text(text.replace(fixture, '', 1), encoding='utf-8')

          # One shared helper keeps synthetic manifest registration behavior identical in both
          # manifest and invocation-kernel tests.
          Path('tests/unit/manifest_helpers.py').write_text(
              '''"""Shared helpers for tests that register synthetic operation manifests."""\n\nfrom tools.manifests import (\n    get_all_manifests,\n    make_manifest,\n    register_manifest,\n    set_active_tools,\n)\n\n\ndef register_test_manifest(name: str, **updates: object) -> None:\n    manifest = make_manifest(name)\n    manifest.update(updates)\n    active = set(get_all_manifests(active_only=True))\n    register_manifest(name, manifest)\n    set_active_tools(active | {name})\n''',
              encoding='utf-8',
          )
          helper = '''def _register(name: str, **updates: object) -> None:\n    manifest = make_manifest(name)\n    manifest.update(updates)\n    active = set(get_all_manifests(active_only=True))\n    register_manifest(name, manifest)\n    set_active_tools(active | {name})\n\n\n'''
          for test_path in ('tests/unit/test_manifests.py', 'tests/unit/test_invocation_kernel.py'):
              p = Path(test_path)
              text = p.read_text(encoding='utf-8')
              if text.count(helper) != 1:
                  raise SystemExit(f'{test_path}: duplicate register helper target missing')
              insert_after = 'import pytest\n'
              import_line = 'from tests.unit.manifest_helpers import register_test_manifest as _register\n'
              text = text.replace(insert_after, insert_after + '\n' + import_line, 1)
              p.write_text(text.replace(helper, '', 1), encoding='utf-8')

          # The shared fixture owns restoration; local finally blocks must not overwrite the
          # pre-test active profile with "all tools" before the fixture restores it.
          replace_once(
              'tests/unit/test_compliance_hardening.py',
              '''def test_empty_active_catalog_stays_empty() -> None:\n    set_active_tools(set())\n    try:\n        assert get_all_manifests(active_only=True) == {}\n    finally:\n        set_active_tools(set(get_all_manifests()))\n''',
              '''def test_empty_active_catalog_stays_empty() -> None:\n    set_active_tools(set())\n    assert get_all_manifests(active_only=True) == {}\n''',
          )
          replace_once(
              'tests/unit/test_compliance_hardening.py',
              '''    try:\n        with principal_scope(principal), pytest.raises(InvocationError) as exc:\n            kernel.invoke_sync("get_all_states", lambda: {"ok": True})\n        assert exc.value.code == "UNAVAILABLE_DEPENDENCY"\n        assert "backend unavailable" in str(exc.value)\n    finally:\n        set_active_tools(set(get_all_manifests()))\n''',
              '''    with principal_scope(principal), pytest.raises(InvocationError) as exc:\n        kernel.invoke_sync("get_all_states", lambda: {"ok": True})\n    assert exc.value.code == "UNAVAILABLE_DEPENDENCY"\n    assert "backend unavailable" in str(exc.value)\n''',
          )
          PY
      - name: Verify in isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -c constraints-ci.txt '.[dev]'
          .venv/bin/ruff format \
            server.py tools/invocation.py tools/settings.py tools/utils.py tools/filesystem_explorer.py \
            context_generator/snapshot.py context_generator/utils.py \
            tests/unit/conftest.py tests/unit/manifest_helpers.py tests/unit/test_manifests.py \
            tests/unit/test_invocation_kernel.py tests/unit/test_compliance_hardening.py \
            tests/unit/test_review_regressions.py tests/e2e/conftest.py tests/e2e/test_server_api.py \
            tests/e2e/test_all_tools_smoke.py tests/integration/conftest.py tests/smoke/conftest.py \
            tests/smoke/test_critical_tools.py tests/smoke/test_input_validation.py \
            tests/smoke/test_response_format.py
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy server.py tools/ context_generator/core.py context_generator/config.py \
            context_generator/runtime.py context_generator/provenance.py context_generator/snapshot.py \
            scripts/verify_runtime_endpoints.py --strict
          .venv/bin/pytest tests/unit tests/protocol -q
          .venv/bin/python -m compileall -q server.py tools context_generator
      - name: Commit and push tested fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr22-review-fix-runner.yml scripts/pr22_review_fix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address PR22 review and CI blockers"
          git push origin HEAD:agent/ai-skills-compliance-refactor
