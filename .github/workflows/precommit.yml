name: Pre-commit gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: precommit-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MCP_TRANSPORT: stdio
  MCP_DEV_TOOLS_ENABLED: "0"
  HA_CONFIG_PATH: /tmp
  ASSESSED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  precommit:
    name: Full pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.ASSESSED_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and pinned pre-commit
        run: |
          python -m pip install -c constraints-ci.txt '.[dev]'
          python -m pip install 'pre-commit==4.3.0'
      - name: Run all configured hooks without bypasses
        run: pre-commit run --all-files
