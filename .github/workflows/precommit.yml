name: Pre-commit gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: precommit-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MCP_TRANSPORT: stdio
  MCP_DEV_TOOLS_ENABLED: "0"
  HA_CONFIG_PATH: /tmp
  ASSESSED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  precommit:
    name: Full pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
        with:
          ref: ${{ env.ASSESSED_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and pinned pre-commit
        run: |
          python -m pip install -c constraints-ci.txt '.[dev]'
          python -m pip install 'pre-commit==4.3.0'
      - name: Run all configured hooks without bypasses
        run: pre-commit run --all-files
