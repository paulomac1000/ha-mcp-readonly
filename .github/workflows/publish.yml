# ai-skills-policy-profile: protected-release
# Candidate code can reach only an isolated quarantine credential. The protected
# publisher never checks out, loads, builds, or runs candidate code/images.
name: Publish tested container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing v* tag or full 40-character commit SHA reachable from the default branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate-build:
    name: Build, quarantine, and test exact digest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release_sha: ${{ steps.revision.outputs.sha }}
      release_tag: ${{ steps.revision.outputs.tag }}
      quarantine_ref: ${{ steps.quarantine.outputs.ref }}
      quarantine_digest: ${{ steps.quarantine.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and constrain release identity
        id: revision
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
        run: |
          set -euo pipefail
          requested="$REQUESTED_REF"
          release_tag=""
          if [[ "$EVENT_NAME" == "push" ]]; then
            release_tag="$EVENT_REF_NAME"
            requested="refs/tags/$release_tag"
          fi
          if [[ "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            release_sha="$requested"
          else
            case "$requested" in
              refs/tags/v*) release_tag="${requested#refs/tags/}" ;;
              v*) release_tag="$requested" ;;
              *) echo "release_ref must be an existing v* tag or full commit SHA" >&2; exit 1 ;;
            esac
            git show-ref --verify --quiet "refs/tags/$release_tag" || {
              echo "Tag not found: $release_tag" >&2
              exit 1
            }
            release_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          fi
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$release_sha^{commit}"
          git merge-base --is-ancestor "$release_sha" "origin/$DEFAULT_BRANCH" || {
            echo "Selected revision is not reachable from origin/$DEFAULT_BRANCH" >&2
            exit 1
          }
          git checkout --detach "$release_sha"
          test "$(git rev-parse HEAD)" = "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Test exact release source and build wheel
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          python -m pip install -c constraints-ci.txt '.[dev]' build==1.6.0 setuptools==84.0.0 wheel==0.48.0
          ruff check .
          ruff format --check .
          mypy server.py tools/ context_generator/core.py context_generator/config.py \
            context_generator/runtime.py context_generator/provenance.py context_generator/snapshot.py \
            scripts/verify_runtime_endpoints.py --strict
          pytest tests/unit tests/protocol -q
          python -m build --wheel --no-isolation
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in only to isolated quarantine registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          # The username is public information. Keeping it out of secrets
          # prevents GitHub from masking any output that embeds the owner
          # name (the quarantine ref), which would blank downstream outputs.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUARANTINE_REGISTRY_TOKEN }}
      - name: Build multi-platform candidate once into quarantine
        id: quarantine
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          quarantine_ref="ghcr.io/${owner}/ha-mcp-readonly-quarantine:sha-${RELEASE_SHA}"
          docker buildx build \
            --file Dockerfile.release \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.revision=${RELEASE_SHA}" \
            --tag "$quarantine_ref" \
            --push .
          digest="$(docker buildx imagetools inspect "$quarantine_ref" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=$quarantine_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Smoke quarantined candidate on every published platform
        shell: bash
        env:
          QUARANTINE_REF: ${{ steps.quarantine.outputs.ref }}
        run: |
          set -euo pipefail
          trap 'docker rm -f ha-mcp-quarantine-amd64 ha-mcp-quarantine-arm64 2>/dev/null || true' EXIT
          for arch in amd64 arm64; do
            # moby#43188: digest-pinned multi-platform refs fail with
            # "Cannot overwrite digest" under --platform. The tag selects
            # the same content per platform; the promote job re-verifies
            # the exact digest before anything is released.
            docker pull --platform "linux/$arch" "$QUARANTINE_REF"
            docker run --rm --platform "linux/$arch" --entrypoint=id "$QUARANTINE_REF" -u | grep -qx '10001'
            docker run --rm --platform "linux/$arch" --entrypoint=python \
              -e MCP_TRANSPORT=stdio -e MCP_DEV_TOOLS_ENABLED=0 \
              "$QUARANTINE_REF" -c 'import server; assert server.get_tool_count() == 145'
            name="ha-mcp-quarantine-$arch"
            docker run -dit --rm --platform "linux/$arch" --name "$name" "$QUARANTINE_REF"
            for attempt in $(seq 1 60); do
              state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$name")"
              [[ "$state" == healthy ]] && break
              [[ "$state" == unhealthy ]] && { docker logs "$name"; exit 1; }
              sleep 1
            done
            test "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy
            docker rm -f "$name"
          done

  publish:
    name: Promote exact tested digest
    needs: validate-build
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      # Docker credentials are keyed by registry hostname, so two ghcr.io logins
      # overwrite each other. Keep this protected environment credential out of
      # the candidate job and grant it only read access to quarantine plus write
      # access to the release package.
      - name: Log in with protected promotion credential
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          # See the quarantine login comment: the username is public and must
          # never be a secret, or GitHub masks refs containing it.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PROMOTION_REGISTRY_TOKEN }}
      - name: Promote exact tested digest without loading candidate image
        id: promote
        shell: bash
        env:
          QUARANTINE_REF: ${{ needs.validate-build.outputs.quarantine_ref }}
          EXPECTED_DIGEST: ${{ needs.validate-build.outputs.quarantine_digest }}
          RELEASE_SHA: ${{ needs.validate-build.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.validate-build.outputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_ref="${QUARANTINE_REF%:*}@${EXPECTED_DIGEST}"
          immutable_ref="$repository:sha-$RELEASE_SHA"
          docker buildx imagetools create --tag "$immutable_ref" "$source_ref"
          test "$(docker buildx imagetools inspect "$immutable_ref" --format '{{.Manifest.Digest}}')" = "$EXPECTED_DIGEST"
          if [[ -n "$RELEASE_TAG" ]]; then
            for tag in "$RELEASE_TAG" latest; do
              docker buildx imagetools create --tag "$repository:$tag" "$source_ref"
              test "$(docker buildx imagetools inspect "$repository:$tag" --format '{{.Manifest.Digest}}')" = "$EXPECTED_DIGEST"
            done
          fi
          echo "digest=$EXPECTED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "subject_name=$repository" >> "$GITHUB_OUTPUT"
      - name: Attest promoted digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3
        with:
          subject-name: ${{ steps.promote.outputs.subject_name }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true
