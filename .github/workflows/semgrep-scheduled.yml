# ai-skills-policy-profile: trusted-ci
name: Semgrep Full Scan (Scheduled)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-full
  cancel-in-progress: true

jobs:
  semgrep-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: semgrep/semgrep@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Semgrep Full Scan
        run: |
          semgrep scan --error --sarif --output=semgrep.sarif \
            --config=auto --config=secrets --config=owasp-top-ten .

      - name: Upload SARIF to GitHub Security
        id: upload-sarif
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7  # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-full

      - name: Warn if SARIF upload failed
        if: always() && steps.upload-sarif.outcome == 'failure'
        run: echo "::warning::SARIF upload failed — scan result remains authoritative"
