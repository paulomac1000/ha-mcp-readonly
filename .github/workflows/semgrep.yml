# ai-skills-policy-profile: trusted-ci
name: Semgrep Security Scan

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  SEMGREP_RULES: p/auto p/secrets p/owasp-top-ten

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: semgrep/semgrep@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Semgrep Scan
        shell: bash
        run: |
          set +e
          semgrep scan --error --sarif --output=semgrep.sarif \
            --config=p/auto --config=p/secrets --config=p/owasp-top-ten .
          status=$?
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("semgrep.sarif")
          if path.exists():
              report = json.loads(path.read_text(encoding="utf-8"))
              for run in report.get("runs", []):
                  for result in run.get("results", []):
                      location = result.get("locations", [{}])[0].get("physicalLocation", {})
                      artifact = location.get("artifactLocation", {}).get("uri", "<unknown>")
                      region = location.get("region", {})
                      line = region.get("startLine", "?")
                      rule = result.get("ruleId", "<unknown-rule>")
                      message = result.get("message", {}).get("text", "")
                      print(f"SEMGREP_FINDING {artifact}:{line} {rule}: {message}")
          PY
          exit "$status"

      - name: Upload SARIF to GitHub Security
        id: upload-sarif
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7  # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Warn if SARIF upload failed
        if: always() && steps.upload-sarif.outcome == 'failure'
        run: echo "::warning::SARIF upload failed — scan result remains authoritative"
