# ai-skills-policy-profile: trusted-ci
name: Semgrep Security Scan

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  SEMGREP_RULES: p/auto p/secrets p/owasp-top-ten
  ASSESSED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  semgrep:
    name: Read-only Semgrep gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: semgrep/semgrep@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ env.ASSESSED_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Semgrep Scan
        shell: bash
        run: |
          set +e
          semgrep scan --sarif --output=semgrep.sarif \
            --config=p/auto --config=p/secrets --config=p/owasp-top-ten .
          scan_status=$?
          set -e
          if [ "$scan_status" -ne 0 ]; then
            echo "Semgrep scan failed before finding triage (exit $scan_status)" >&2
            exit "$scan_status"
          fi
          python scripts/check_semgrep_sarif.py semgrep.sarif --repository-root .

      - name: Preserve SARIF evidence
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: semgrep-sarif-${{ env.ASSESSED_SHA }}
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 7

  sarif-upload:
    name: Publish trusted-main SARIF
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download SARIF evidence from this run
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: semgrep-sarif-${{ env.ASSESSED_SHA }}
          path: semgrep-evidence

      - name: Upload SARIF to GitHub Security
        id: upload-sarif
        if: steps.download.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7  # v4
        with:
          sarif_file: semgrep-evidence/semgrep.sarif
          category: semgrep

      - name: Warn if SARIF publication failed
        if: steps.download.outcome == 'failure' || steps.upload-sarif.outcome == 'failure'
        run: echo "::warning::SARIF publication failed — read-only Semgrep gate remains authoritative"
